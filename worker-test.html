<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Worker Fetch Test</title>
<style>
  body { font-family: sans-serif; padding: 20px; background: #111; color: #eee; }
  button { padding: 14px 20px; font-size: 16px; margin: 8px 0; width: 100%; }
  #result { white-space: pre-wrap; background: #222; padding: 12px; border-radius: 8px; margin-top: 12px; font-size: 13px; }
</style>
</head>
<body>
  <h2>Worker Fetch Test</h2>
  <p>API_BASE: <code>https://rewardfarm-backend.bsilimited1.workers.dev</code></p>

  <button onclick="testGet()">1. Test GET /balance</button>
  <button onclick="testPost()">2. Test POST /balance</button>
  <button onclick="testPostSimple()">3. Test POST (text/plain, no preflight)</button>

  <div id="result">Results will appear here...</div>

<script>
  const API_BASE = 'https://rewardfarm-backend.bsilimited1.workers.dev';
  const out = document.getElementById('result');

  function log(label, data) {
    out.textContent = label + ':\n' + (typeof data === 'string' ? data : JSON.stringify(data, null, 2));
  }

  async function testGet() {
    log('GET /balance', 'Running...');
    try {
      const res = await fetch(`${API_BASE}/balance`);
      const text = await res.text();
      log('GET /balance', `Status: ${res.status}\nBody: ${text}`);
    } catch(e) {
      log('GET /balance ERROR', `${e.name}: ${e.message}`);
    }
  }

  async function testPost() {
    log('POST /balance (json)', 'Running...');
    try {
      const res = await fetch(`${API_BASE}/balance`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ initData: 'test' })
      });
      const text = await res.text();
      log('POST /balance (json)', `Status: ${res.status}\nBody: ${text}`);
    } catch(e) {
      log('POST /balance (json) ERROR', `${e.name}: ${e.message}`);
    }
  }

  async function testPostSimple() {
    log('POST /balance (text/plain)', 'Running...');
    try {
      // text/plain is a "simple" content-type -> browser skips CORS preflight (OPTIONS)
      const res = await fetch(`${API_BASE}/balance`, {
        method: 'POST',
        headers: {'Content-Type': 'text/plain'},
        body: JSON.stringify({ initData: 'test' })
      });
      const text = await res.text();
      log('POST /balance (text/plain)', `Status: ${res.status}\nBody: ${text}`);
    } catch(e) {
      log('POST /balance (text/plain) ERROR', `${e.name}: ${e.message}`);
    }
  }
</script>
</body>
</html>
